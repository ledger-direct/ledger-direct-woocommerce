name: CI

# The "changes" job classifies the pull request or push first. A documentation-only change (Markdown,
# docs/, changelog, readme.txt, licence, CodeRabbit config) runs lint alone; everything else runs the
# whole suite. A newer push to the same pull request cancels the run still going.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, Monday: the whole suite on main, and the check that the branch and tag rules on GitHub
  # are the ones in .github/rulesets/main.json and tags.json.
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

# Every job only reads the repository; nothing here writes to GitHub, except Plugin Check's PR
# comment (see that job).
permissions:
  contents: read

# A newer push to the same pull request cancels its run in progress. Every other run (push to main,
# tag, manual) gets a group of its own: GitHub keeps only one pending run per group, so a shared
# group would cancel a pending main run whose changes the next run never classifies again.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every external action is referenced by a full commit SHA, with its version as a comment: a tag
  # can be moved to other code, a commit cannot. Dependabot keeps the SHAs current.
  pinned:
    name: Actions pinned to commit SHAs
    needs: changes
    # Fail-safe as for the other jobs: a failed `changes` job leaves docs_only empty, and the check
    # runs. A documentation-only change cannot touch a workflow or an action.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every external action is pinned to a full commit SHA
        run: |
          # The key is spelled apart, so this file does not match its own pattern.
          key=uses
          unpinned=$(grep -rnoE "${key}:\s*[^ #]+" .github/ | grep -v "${key}: \./" | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::Actions not pinned to a full commit SHA (owner/action@<sha> # vX.Y.Z):"
            echo "$unpinned"
            exit 1
          fi

  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request: the merge commit and both parents; push: the pushed range
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - id: changes
        uses: ./.github/actions/changes

  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
      - name: Lint all PHP files
        run: |
          find . \
            -path ./vendor -prune -o \
            -path ./node_modules -prune -o \
            -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  phpcs:
    name: WordPress Coding Standards (phpcs)
    needs: changes
    # Fail-safe: if the "changes" job fails, its output is empty and this job runs anyway
    # (a skipped job would count as passed).
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli
          coverage: none
      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run phpcs
        run: vendor/bin/phpcs -p

  phpstan:
    name: Static analysis (phpstan)
    needs: changes
    # Fail-safe: if the "changes" job fails, its output is empty and this job runs anyway
    # (a skipped job would count as passed).
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli
          coverage: none
      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run phpstan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    needs: changes
    # Fail-safe: if the "changes" job fails, its output is empty and this job runs anyway
    # (a skipped job would count as passed).
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # Empty in a Dependabot pull request, which runs without the repository's secrets; the Docker Hub
    # login below is then skipped and the images are pulled anonymously.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # MySQL as a plain container after a Docker Hub login, not as a `services:`
      # container: a service starts before any step and so can only pull
      # anonymously, and both anonymous routes fail on shared runners - Docker Hub
      # by pull count per IP, AWS's public mirror by data volume per month
      # ("toomanyrequests: Data limit exceeded", seen 2026-10-16). Logged in, the
      # pull counts against the organisation's account.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start MySQL
        run: |
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=root \
            --health-cmd="mysqladmin ping -uroot -proot" --health-interval=5s --health-timeout=5s --health-retries=20 \
            mysql:8.0
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mysql)" = "healthy" ] && break
            sleep 3
          done
          docker inspect -f 'mysql: {{.State.Health.Status}}' mysql
          [ "$(docker inspect -f '{{.State.Health.Status}}' mysql)" = "healthy" ]

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, intl, zip
          coverage: none

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install subversion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion

      - name: Install WP test suite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Install WooCommerce into the WP test install
        run: |
          curl -sSL https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip -o /tmp/woocommerce.zip
          mkdir -p /tmp/wordpress/wp-content/plugins
          unzip -q /tmp/woocommerce.zip -d /tmp/wordpress/wp-content/plugins

      - name: Link this plugin into the WP test install
        run: ln -s "$GITHUB_WORKSPACE" /tmp/wordpress/wp-content/plugins/ledger-direct

      - name: Run phpunit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: vendor/bin/phpunit -c phpunit.xml

  plugin-check:
    name: WordPress Plugin Check
    needs: changes
    # Fail-safe: if the "changes" job fails, its output is empty and this job runs anyway
    # (a skipped job would count as passed).
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    # Plugin Check posts its findings as a comment on the pull request (create, update, delete).
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    # Empty in a Dependabot pull request, which runs without the repository's secrets; the Docker Hub
    # login below is then skipped and the images are pulled anonymously.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      # Checked out under the plugin's actual WordPress.org slug (ledger-direct) rather
      # than the GitHub repo name (ledger-direct-woocommerce) - Plugin Check derives the
      # expected text domain from the directory name it scans, and it must match the
      # `Text Domain: ledger-direct` header used throughout the codebase.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ledger-direct
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli
          coverage: none
      - name: Install composer dependencies (production only)
        working-directory: ledger-direct
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      # Plugin Check scans build-dir as-is - it does not know this is a raw git checkout,
      # so without this it also flags .git, .github, tests/, dev tooling configs etc. as
      # if they shipped in the plugin. Reuse .distignore (the same exclude list the
      # WordPress.org SVN release build in scripts/deploy-wp-org.sh uses) to produce a
      # clean copy and point Plugin Check at that instead of the raw checkout.
      - name: Build a clean plugin copy for Plugin Check
        run: |
          mkdir -p /tmp/plugin-build/ledger-direct
          rsync -a --exclude-from=ledger-direct/.distignore ledger-direct/ /tmp/plugin-build/ledger-direct/
          # .distignore deliberately excludes .wp-env.json from the real WP.org release
          # build (it has no purpose there), but Plugin Check's own environment needs it
          # to know to install WooCommerce - copy it back in for this build only.
          cp ledger-direct/.wp-env.json /tmp/plugin-build/ledger-direct/.wp-env.json

      # Plugin Check runs wp-env, which pulls WordPress and MariaDB from Docker Hub.
      # Logged in, the pulls count against the account (200 per six hours), not
      # against the runner's shared IP. The runner's Docker config is shared, so
      # the login reaches wp-env's pulls.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: '/tmp/plugin-build/ledger-direct'
          # .wp-env.json has to be physically present in build-dir for the wp-env-based
          # WooCommerce dependency setup above to work, but Plugin Check's own file-type
          # check then flags that same file as a disallowed hidden file. Exclude it from
          # the check results specifically (not from the scanned directory).
          exclude-files: '.wp-env.json'

  # Weekly and on demand: the rulesets GitHub enforces on main and on tags are the ones in
  # .github/rulesets/main.json and tags.json.
  # Not part of "CI passed": a pull request that changes the file differs from GitHub until the
  # ruleset is applied after the merge.
  ruleset:
    name: Branch rules match .github/rulesets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the rulesets on GitHub with the files
        env:
          GH_TOKEN: ${{ github.token }}
        # Both files are checked, also when the first differs.
        run: |
          rc=0
          .github/rulesets/check.sh "$GITHUB_REPOSITORY" .github/rulesets/main.json || rc=1
          .github/rulesets/check.sh "$GITHUB_REPOSITORY" .github/rulesets/tags.json || rc=1
          exit $rc

  # The one check a merge into main requires. Its name is in .github/rulesets/main.json: renaming the
  # job blocks every merge until the ruleset on GitHub is changed too. A job's own name changes with
  # its matrix and shows unexpanded when the job is skipped, so the branch rules name this job
  # instead. Skipped on purpose (a documentation-only pull request) counts as passed; failed or
  # cancelled does not. always(), not !cancelled(): a skipped job counts as passed, so this job has
  # to run and report in every case.
  passed:
    name: CI passed
    needs: [changes, lint, phpcs, phpstan, phpunit, plugin-check, pinned]
    if: always()
    runs-on: ubuntu-latest
    # Reads this run's job list, nothing else.
    permissions:
      actions: read
    steps:
      - name: Every job passed or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
          # Jobs this check leaves out, by the start of their name: the weekly ruleset check, not in needs
          UNGATED: '["Branch rules match"]'
        # needs.<job>.result can say "success" for a matrix one of whose legs was cancelled before a
        # runner took it (https://github.com/orgs/community/discussions/211624), so every finished job
        # of this run, each matrix leg on its own, is checked as well, except the ones in UNGATED:
        # whether they are finished at this point is a matter of timing.
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
          gh api "$JOBS" > jobs.json
          jq --argjson ungated "$UNGATED" '[.jobs[] | select(.status == "completed")
            | select(.name as $n | $ungated | any(. as $p | $n | startswith($p)) | not)]' jobs.json > gated.json
          jq -r '.[] | "\(.name): \(.conclusion)"' gated.json
          jq -e 'all(.[]; .conclusion == "success" or .conclusion == "skipped")' gated.json > /dev/null
