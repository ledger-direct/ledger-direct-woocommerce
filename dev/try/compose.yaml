# LedgerDirect for WooCommerce — try it in five minutes, on the XRP Ledger and Xahau testnets.
#
#   docker compose up -d --wait          # first start installs the shop, well under a minute
#   open http://localhost:8092/
#   docker compose down                  # stop; the shop and its orders stay in the volumes
#   docker compose down -v               # reset: the next `up` installs a fresh shop
#
# Settings (environment or a .env file next to this one):
#   LD_TRY_PORT          host port of the shop (default 8092, bound to 127.0.0.1 only)
#   LD_TESTNET_ACCOUNT   your testnet receiving address (it needs the RLUSD and USDC trust lines).
#                        Without it the shop creates its own testnet wallet with those trust lines.
#                        XAH always goes to the shop's own Xahau testnet account, made on the first
#                        start and funded from the Xahau faucet: one account per chain.
#   LD_TRY_IMAGE         the shop image (default: the published one; `--build` builds this checkout)
#
# The shop's service is named as the end-to-end harness expects (wp, with WP-CLI inside). Nothing but
# the shop is published to the host; the database stays inside this stack. The shop's state lives in
# named volumes, so recreating a container (a new image, a changed LD_TESTNET_ACCOUNT) keeps the shop
# and its orders.
name: ledger-direct-try-woocommerce

services:
  wp:
    image: ${LD_TRY_IMAGE:-ghcr.io/ledger-direct/try-woocommerce:latest}
    build:
      context: ../..
      dockerfile: dev/try/Dockerfile
    environment:
      LD_BASE_URL: http://localhost:${LD_TRY_PORT:-8092}
      LD_TESTNET_ACCOUNT: ${LD_TESTNET_ACCOUNT:-}
      LD_STABLECOINS: ${LD_STABLECOINS:-1}
    ports:
      - "127.0.0.1:${LD_TRY_PORT:-8092}:8080"
    volumes:
      - shop-uploads:/var/www/html/wp-content/uploads
      - shop-state:/var/lib/ledger-direct-try
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4.13
    environment:
      MARIADB_ROOT_PASSWORD: wordpress
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

volumes:
  shop-uploads:
  shop-state:
  db-data:
