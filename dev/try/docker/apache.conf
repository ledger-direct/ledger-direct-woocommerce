# The try shop: WordPress's permalink rules here instead of an .htaccess file (the code is read-only
# for the web server), and nothing but WordPress is served.
ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    RewriteEngine On
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteBase /
    RewriteRule ^index\.php$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.php [L]
</Directory>

# Uploads are pictures and WooCommerce's files, never code.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
